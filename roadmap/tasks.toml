body = "`mix precommit.full` ends with `agents.check`, which shells out to `~/_DATA/code/claude-marketplace/scripts/sync-agents-md.sh --check`. `host_script/3` currently looks at that single expanded path and, if it is missing, prints `[skip]` and returns `:ok`.\n\nEvidence from post-merge audit of `8fe709f` (run-1789909073241-f063fa15, 2026-09-20): `mix precommit.full` exited 0 after `[skip] AGENTS.md freshness check: /home/harness/_DATA/code/claude-marketplace/scripts/sync-agents-md.sh not found`. The same host already had working copies at `~/.claude/plugins/marketplaces/zenhive/scripts/sync-agents-md.sh` and `~/.grok/marketplace-cache/*/scripts/sync-agents-md.sh`. Running either `--check` at that revision reported `STALE: ./AGENTS.md has drifted from CLAUDE.md` — transitive `harness-workflow.md` drift the alias never saw.\n\n**Decision (vetoable):** after the existing operator-checkout path, try well-known installed-marketplace locations for `sync-agents-md.sh` (Claude Code's zenhive marketplace plugin directory, then a grok marketplace-cache copy if present). First existing executable wins. If none exist, keep today's loud skip. Do not fail the portable `ci` alias; this is only `agents.check` / `precommit.full`.\n\nThe skip is why harness audit workers can ship a stale `AGENTS.md` while reporting a green `precommit.full`. Cross-family reviewers read `AGENTS.md`, not `CLAUDE.md`.\n\n\nOperator instruction 2026-09-21, coordinated by harness Task 448: finish focused dispatch versus asynchronous full audit QA. Inspection of origin/main mix.exs on 2026-09-21 found check.dispatch still invokes full-project tests or analyzers despite the central policy already being imported. This is check infrastructure, so use the independent implement/review/land workflow. The choice is settled: focused checks before approval, full checks after landing; no prior green-QA prerequisite. Preserve all existing QA checks when disentangling aliases, especially when ci/precommit.full currently calls check.dispatch. Do not change runtime/autonomy settings, restart services, install hooks, or bypass safety hooks. The orchestrator owns live qa_command settings. Update any instructions/tests coupled to the changed aliases; unrelated full-QA repair stays in its existing task. Report the exact full-QA command for the orchestrator."
