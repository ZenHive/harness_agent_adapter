acceptance_criteria = ["On a host where `~/_DATA/code/claude-marketplace/scripts/sync-agents-md.sh` is missing but a marketplace-installed copy of that script exists, `mix agents.check` runs `--check` and does not print the `[skip] AGENTS.md freshness check` line", "When no copy of the script exists on the host, `mix agents.check` still skips loudly and returns success (CI-safe, same as today)", "A stale `AGENTS.md` vs `CLAUDE.md` (+ transitive `@`-imports) still fails `mix agents.check` whenever a script copy is found", "check.dispatch performs formatting and compilation plus only required bootstrap; reviewers select focused behavior tests and risk-relevant live/security checks. It does not run the full suite, coverage, Dialyzer, Reach, Sobelow, Credo, Doctor or clone checks.", "Every check removed from dispatch remains reachable through the full QA entry point; preserve assertions, coverage thresholds, live-provider evidence and failure behavior. Expand dependencies from ci/precommit.full on check.dispatch so slimming dispatch cannot silently weaken QA.", "CLAUDE.md imports the canonical verification-policy include and accurately describes the aliases. Regenerate AGENTS.md using the existing generator when available; report unavailable generation for the orchestrator. Do not duplicate scheduling policy or edit generated instructions manually.", "Focused regression tests prove alias separation and retained full-QA steps. Capture the before/after alias graph; ordinary implementation/review does not run every analyzer merely for this configuration change."]
